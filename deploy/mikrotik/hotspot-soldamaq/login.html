<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soldamaq WiFi</title>
  <style>
    :root {
      color-scheme: light;
      --green: #19672e;
      --blue: #133c49;
      --yellow: #fdda00;
      --black: #1d1d1b;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--blue);
      color: var(--white);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 64px;
      margin-bottom: 22px;
      padding: 12px 18px;
      border: 3px solid var(--yellow);
      background: var(--green);
      color: var(--yellow);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 22px;
      color: rgba(255, 255, 255, .86);
      font-size: 16px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 6px;
      background: var(--yellow);
      color: var(--black);
      font-size: 17px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Soldamaq</div>
    <h1>Preparando seu acesso</h1>
    <p>Toque em continuar para abrir a tela de cadastro e liberar sua internet.</p>
    <form id="redirect" action="https://automation.soldamaq.com.br/mikrotik/portal" method="get">
      <input type="hidden" name="mac" value="$(mac)">
      <input type="hidden" name="ip" value="$(ip)">
      <input type="hidden" name="link-login-only" value="$(link-login-only)">
      <input type="hidden" name="link-orig" value="$(link-orig)">
      <input type="hidden" name="site" value="btmae4e2">
      <input type="hidden" name="ssid" value="SOLDAMAQ-CLIENTES">
      <button type="submit">Continuar</button>
    </form>
  </main>
</body>
</html>
