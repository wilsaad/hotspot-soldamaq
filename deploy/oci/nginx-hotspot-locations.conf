# Blocos para adicionar dentro do server 443 de /srv/nginx/conf/n8n.conf.
# Mantem o n8n na raiz do dominio e encaminha somente o portal hotspot.

location = /healthz {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location = /portal {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location = /register {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location = /send-otp {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location = /otp {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location = /validate-otp {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location = /authorize {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location ^~ /whatsapp/ {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location ^~ /admin {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location ^~ /public/ {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}

location ^~ /guest/ {
    proxy_pass http://hotspot_portal:3000;
    include /etc/nginx/conf.d/proxy-hotspot-headers.conf;
}
