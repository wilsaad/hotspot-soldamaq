name: hotspot-enterprise

services:
  nginx:
    image: nginx:latest
    container_name: hotspot-nginx
    restart: unless-stopped
    depends_on:
      - portal-app
      - n8n
      - evolution-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/www:/var/www/certbot:ro
      - nginx_certs:/etc/letsencrypt
      - portal_logs:/var/log/nginx
    networks:
      - frontend
      - backend

  certbot:
    image: certbot/certbot:latest
    container_name: hotspot-certbot
    profiles: ["tls"]
    volumes:
      - ./nginx/www:/var/www/certbot
      - nginx_certs:/etc/letsencrypt
    networks:
      - frontend

  portal-app:
    build:
      context: ./portal
    container_name: hotspot-portal
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - portal_logs:/app/logs
    networks:
      - backend
      - data

  worker:
    build:
      context: ./portal
    container_name: hotspot-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - ./.env
    depends_on:
      - portal-app
      - redis
      - postgres
    volumes:
      - portal_logs:/app/logs
    networks:
      - backend
      - data

  postgres:
    image: postgres:15
    container_name: hotspot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - data

  redis:
    image: redis:7
    container_name: hotspot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - data

  n8n:
    image: n8nio/n8n:latest
    container_name: hotspot-n8n
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${PUBLIC_HOST}/n8n/
      WEBHOOK_URL: https://${PUBLIC_HOST}/n8n/
      N8N_PATH: /n8n/
      N8N_PROXY_HOPS: 1
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - backend
      - data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: hotspot-evolution
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: https://${PUBLIC_HOST}/evolution
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_POSTGRES_DB}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_hotspot
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      LOG_LEVEL: ERROR,WARN,INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - backend
      - data

networks:
  frontend:
  backend:
  data:

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_data:
  nginx_certs:
  portal_logs:
